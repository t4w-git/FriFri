services:
  db:
    image: mariadb:latest
    container_name: frifri_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USER:-frifri}
      MYSQL_PASSWORD: ${DB_PASSWORD:-frifri123}
      MYSQL_DATABASE: ${DB_NAME:-frifri_db}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frifri_network

  redis:
    image: redis:7-alpine
    container_name: frifri_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frifri_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frifri_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: mysql://${DB_USER:-frifri}:${DB_PASSWORD:-frifri123}@db:3306/${DB_NAME:-frifri_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_secret_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@frifri.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Change_This_Password_2026!}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frifri_network
    command: npm start

volumes:
  db_data:
  uploads_data:

networks:
  frifri_network:
    driver: bridge
