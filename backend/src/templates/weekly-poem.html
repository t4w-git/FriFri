<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html data-editor-version="2" class="sg-campaigns" xmlns="http://www.w3.org/1999/xhtml">
    <head>
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
      <meta http-equiv="X-UA-Compatible" content="IE=Edge">
      <style type="text/css">
        body, p, div { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; }
        body { color: #1C1C1C; }
        body a { color: #C4956A; text-decoration: none; }
        p { margin: 0; padding: 0; }
        table.wrapper { width:100% !important; table-layout: fixed; -webkit-font-smoothing: antialiased; }
        img.max-width { max-width: 100% !important; }
        @media screen and (max-width:480px) {
          table.wrapper-mobile { width: 100% !important; table-layout: fixed; }
          img.max-width { height: auto !important; max-width: 100% !important; }
          .columns { width: 100% !important; }
          .column { display: block !important; width: 100% !important; padding-left: 0 !important; padding-right: 0 !important; }
        }
      </style>
    </head>
    <body>
      <center class="wrapper" data-link-color="#C4956A" data-body-style="font-size:14px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color:#1C1C1C; background-color:#FFFFFF;">
        <div class="webkit">
          <table cellpadding="0" cellspacing="0" border="0" width="100%" class="wrapper" bgcolor="#FFFFFF">
            <tr>
              <td valign="top" bgcolor="#FFFFFF" width="100%">
                <table width="100%" role="content-container" class="outer" align="center" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td width="100%">
                      <table width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px;" align="center">
                              <tr>
                                <td role="modules-container" style="padding:0px; color:#1C1C1C; text-align:left;" bgcolor="#FFFFFF" width="100%" align="center">
                                  
                                  <!-- HEADER: Logo -->
                                  <table class="module" role="module" data-type="text" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                    <tbody>
                                      <tr>
                                        <td style="padding:40px 40px 30px 40px; text-align:left;" valign="top" bgcolor="#FFFFFF" role="module-content">
                                          <div style="font-family: 'Georgia', 'Garamond', serif;">
                                            <span style="font-size: 52px; font-weight: bold; color: #1C1C1C; letter-spacing: -1px;">fri<span style="color: #C4956A;">fri</span></span><span style="color: #999999; font-size: 28px; margin-left: 2px;">.it</span>
                                          </div>
                                        </td>
                                      </tr>
                                    </tbody>
                                  </table>

                                  <!-- DIVIDER -->
                                  <table class="module" role="module" data-type="divider" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                    <tbody>
                                      <tr>
                                        <td style="padding:0px 40px 30px 40px; line-height:10px; text-align:center;" valign="top" bgcolor="#FFFFFF" role="module-content">
                                          <table border="0" cellpadding="0" cellspacing="0" align="center" width="100%" style="border-top:1px solid #E8E8E8; -webkit-border-vertical-spacing:0; -webkit-border-horizontal-spacing:0;"></table>
                                        </td>
                                      </tr>
                                    </tbody>
                                  </table>

                                  <!-- MAIN TITLE -->
                                  <table class="module" role="module" data-type="text" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                    <tbody>
                                      <tr>
                                        <td style="padding:0px 40px 20px 40px; line-height:40px; text-align:left;" height="100%" valign="top" bgcolor="#FFFFFF" role="module-content">
                                          <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
                                            <span style="font-size: 28px; font-weight: 600; color: #1C1C1C; line-height: 36px;">{{poemTitle}}</span>
                                          </div>
                                        </td>
                                      </tr>
                                    </tbody>
                                  </table>

                                  <!-- POEM TEXT -->
                                  <table class="module" role="module" data-type="text" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                    <tbody>
                                      <tr>
                                        <td style="padding:0px 40px 30px 40px; line-height:24px; text-align:left; white-space: pre-wrap;" height="100%" valign="top" bgcolor="#FFFFFF" role="module-content">
                                          <div style="font-family: 'Georgia', 'Garamond', serif; color: #333333; font-size: 15px; line-height: 24px;">
                                            {{poemText}}
                                          </div>
                                        </td>
                                      </tr>
                                    </tbody>
                                  </table>

                                  <!-- AUTHOR -->
                                  <table class="module" role="module" data-type="text" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                    <tbody>
                                      <tr>
                                        <td style="padding:0px 40px 30px 40px; line-height:20px; text-align:right;" height="100%" valign="top" bgcolor="#FFFFFF" role="module-content">
                                          <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
                                            <span style="color: #999999; font-size: 14px; line-height: 20px;">— {{poemAuthor}}</span>
                                          </div>
                                        </td>
                                      </tr>
                                    </tbody>
                                  </table>

                                  <!-- DIVIDER -->
                                  <table class="module" role="module" data-type="divider" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                    <tbody>
                                      <tr>
                                        <td style="padding:0px 40px 30px 40px; line-height:10px; text-align:center;" valign="top" bgcolor="#FFFFFF" role="module-content">
                                          <table border="0" cellpadding="0" cellspacing="0" align="center" width="100%" style="border-top:1px solid #E8E8E8;"></table>
                                        </td>
                                      </tr>
                                    </tbody>
                                  </table>

                                  <!-- FOOTER -->
                                  <table class="module" role="module" data-type="text" border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
                                    <tbody>
                                      <tr>
                                        <td style="padding:0px 40px 40px 40px; line-height:20px; text-align:center;" height="100%" valign="top" bgcolor="#FFFFFF" role="module-content">
                                          <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
                                            <span style="color: #999999; font-size: 12px; line-height: 18px;">Ricevi questa email perché sei iscritto alla nostra newsletter.</span>
                                            <p style="color: #999999; font-size: 12px; line-height: 18px; margin-top: 10px;">
                                              <a href="{{unsubscribeUrl}}" style="color: #C4956A; text-decoration: underline;">Annulla l'iscrizione</a>
                                            </p>
                                          </div>
                                        </td>
                                      </tr>
                                    </tbody>
                                  </table>

                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </div>
      </center>
    </body>
</html>
